# Publishes a release when a tag v* is pushed. Nothing is built here. `verify` fetches the dist/ that CI built and
# tested for the tagged commit and checks it with release.py; `publish` uploads exactly those files to PyPI with
# trusted publishing, without checking out or running any repository code.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the CI build of the tagged commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit of main."
            exit 1
          fi
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful CI run on main for $GITHUB_SHA. Wait for CI to pass on main, then push the tag again."
            exit 1
          fi
          live=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '[.artifacts[] | select(.name | test("^(dist|tested)-")) | select(.expired | not)] | length')
          if [ "$live" -lt 10 ]; then
            echo "::error::The build of $GITHUB_SHA (CI run $run_id) is gone: GitHub keeps it for 90 days. Re-run that CI run to build and test it again, then re-run this workflow."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      # the builds, and the test records the test jobs made of them
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
          pattern: tested-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run release.py "$GITHUB_REF_NAME" --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/lgbmjit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "lgbmjit"
description = "Compile LightGBM models to machine code with Cranelift for fast predictions that match LightGBM exactly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8", "lightgbm>=4.0", "pandas>=1.5"]
dev = ["fastaistyle", "fastfmt", "pyright", "pre-commit"]

[tool.maturin]
python-source = "python"
module-name = "lgbmjit._lgbmjit"
manifest-path = "crates/lgbmjit-python/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["python"]
extraPaths = ["python"]

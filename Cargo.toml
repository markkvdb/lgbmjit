[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
cranelift-codegen = "=0.137.1"
cranelift-frontend = "=0.137.1"
cranelift-jit = "=0.137.1"
cranelift-module = "=0.137.1"
cranelift-native = "=0.137.1"
lgbmjit-core = { path = "crates/lgbmjit-core" }

[workspace.metadata.fastfmt]
join_comments = true

# Cranelift is slow unoptimised; tests and debug builds compile dependencies with optimisations.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"

[package]
name = "lgbmjit-python"
description = "Python bindings for lgbmjit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "_lgbmjit"
crate-type = ["cdylib"]

[dependencies]
lgbmjit-core.workspace = true
numpy = "0.30.0"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
